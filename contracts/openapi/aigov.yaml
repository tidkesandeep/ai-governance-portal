openapi: 3.1.1
info:
  title: AI Governance Control Plane API
  version: 0.3.0
  description: |
    Slice 3 contract: AI system registry, deterministic risk assessment,
    hashed evidence with freshness and version binding, immutable governance
    snapshots, and short-lived HMAC-signed deployment authorization.
    Unknown or stale evidence cannot satisfy a mandatory control. BLOCK and
    REVIEW snapshots never mint an authorization.
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8000
    description: Local
tags:
  - name: Health
  - name: AI Systems
  - name: Risk
  - name: Policy
  - name: Audit
  - name: Evidence
  - name: Authorization
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Liveness
      operationId: getHealth
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ready:
    get:
      tags: [Health]
      security: []
      summary: Readiness
      operationId: getReady
      responses:
        "200":
          description: Dependencies are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Not ready
  /v1/ai-systems:
    get:
      tags: [AI Systems]
      summary: List AI systems for the authenticated tenant
      operationId: listAISystems
      responses:
        "200":
          description: Inventory page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystemList"
    post:
      tags: [AI Systems]
      summary: Register an AI system
      operationId: registerAISystem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AISystemRegistration"
      responses:
        "201":
          description: Registered in DRAFT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/ai-systems/{systemId}:
    get:
      tags: [AI Systems]
      summary: Get AI System 360 payload
      operationId: getAISystem
      parameters:
        - $ref: "#/components/parameters/systemId"
      responses:
        "200":
          description: Canonical system view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/assessments:
    post:
      tags: [Risk]
      summary: Compute a deterministic risk assessment
      operationId: assessAISystem
      parameters:
        - $ref: "#/components/parameters/systemId"
      responses:
        "201":
          description: New assessment snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAssessment"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/approvals:
    post:
      tags: [Policy]
      summary: Record a control-function approval
      operationId: recordApproval
      parameters:
        - $ref: "#/components/parameters/systemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "201":
          description: Approval recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "409":
          description: Segregation of duties violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/oversight:
    post:
      tags: [Policy]
      summary: Attach human-oversight controls
      operationId: attachOversight
      parameters:
        - $ref: "#/components/parameters/systemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OversightRequest"
      responses:
        "200":
          description: Oversight updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/deployments/gate:
    post:
      tags: [Policy]
      summary: Evaluate the production deployment gate
      operationId: evaluateDeploymentGate
      parameters:
        - $ref: "#/components/parameters/systemId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentGateRequest"
      responses:
        "200":
          description: Gate decision (ALLOW, REVIEW, or BLOCK) plus fingerprint; authorizationId only on ALLOW
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecision"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/audit-events:
    get:
      tags: [Audit]
      summary: Append-only audit trail for an AI system
      operationId: listAuditEvents
      parameters:
        - $ref: "#/components/parameters/systemId"
      responses:
        "200":
          description: Oldest-first hash-chained events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/evidence:
    post:
      tags: [Evidence]
      summary: Attach hashed evidence bound to the current asset version
      operationId: attachEvidence
      parameters:
        - $ref: "#/components/parameters/systemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceAttachRequest"
      responses:
        "201":
          description: Evidence stored and hashed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/evidence/{evidenceId}/verify:
    post:
      tags: [Evidence]
      summary: Recompute the digest of stored bytes and compare to the record
      operationId: verifyEvidence
      parameters:
        - $ref: "#/components/parameters/systemId"
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verification status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/authorizations/{authorizationId}/verify:
    post:
      tags: [Authorization]
      summary: Verify a short-lived deployment authorization
      description: |
        Returns HTTP 200 with outcome ALLOW or DENY. Expired, revoked, consumed,
        version-mismatched, or tampered signatures are DENY — never a silent pass.
      operationId: verifyDeploymentAuthorization
      parameters:
        - $ref: "#/components/parameters/systemId"
        - $ref: "#/components/parameters/authorizationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationVerifyRequest"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationVerify"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/authorizations/{authorizationId}/revoke:
    post:
      tags: [Authorization]
      summary: Revoke a deployment authorization immediately
      operationId: revokeDeploymentAuthorization
      parameters:
        - $ref: "#/components/parameters/systemId"
        - $ref: "#/components/parameters/authorizationId"
      responses:
        "200":
          description: Authorization is no longer valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentAuthorization"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/versions:
    post:
      tags: [AI Systems]
      summary: Cut a new asset version so prior evidence no longer satisfies controls
      operationId: cutAssetVersion
      parameters:
        - $ref: "#/components/parameters/systemId"
      responses:
        "201":
          description: New current version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Slice 1 demo tokens `demo` (engineer) and `demo-reviewer` (privacy/security).
  parameters:
    systemId:
      name: systemId
      in: path
      required: true
      schema:
        type: string
    authorizationId:
      name: authorizationId
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found in this tenant
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationError:
      description: Request failed schema validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        details:
          type: object
          additionalProperties: true
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        traceId:
          type: string
        reasons:
          type: array
          items:
            type: string
    AISystemRegistration:
      type: object
      required:
        - name
        - systemType
        - businessPurpose
        - owner
        - environment
        - dataClassification
        - geography
        - autonomyLevel
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        systemType:
          $ref: "#/components/schemas/SystemType"
        businessPurpose:
          type: string
        owner:
          type: string
        environment:
          $ref: "#/components/schemas/Environment"
        dataClassification:
          $ref: "#/components/schemas/DataClassification"
        geography:
          type: string
        autonomyLevel:
          $ref: "#/components/schemas/AutonomyLevel"
        modelRefs:
          type: array
          items:
            type: string
        vendorRefs:
          type: array
          items:
            type: string
        intendedUsers:
          type: string
        customerImpact:
          $ref: "#/components/schemas/ImpactLevel"
        financialImpact:
          $ref: "#/components/schemas/ImpactLevel"
        humanOversight:
          type: array
          items:
            type: string
        knownLimitations:
          type: string
        usesCustomerDecision:
          type: boolean
          default: false
        publicEndpoint:
          type: boolean
          default: false
        evaluationRefs:
          type: array
          items:
            type: string
        monitoringEnabled:
          type: boolean
          default: false
    SystemType:
      type: string
      enum: [PREDICTIVE_MODEL, GENAI_APP, AGENT, THIRD_PARTY_LLM, DATASET]
    Environment:
      type: string
      enum: [dev, test, staging, production]
    DataClassification:
      type: string
      enum: [PUBLIC, INTERNAL, CONFIDENTIAL, PII, PCI, RESTRICTED]
    AutonomyLevel:
      type: string
      enum: [HUMAN_IN_LOOP, ASSISTIVE, SEMI_AUTONOMOUS, AUTONOMOUS]
    ImpactLevel:
      type: string
      enum: [NONE, LOW, MEDIUM, HIGH, CRITICAL]
    LifecycleStatus:
      type: string
      enum:
        - DRAFT
        - ASSESSMENT_PENDING
        - REVIEW_REQUIRED
        - APPROVED
        - BLOCKED
        - DEPLOYMENT_PENDING
    RiskBand:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    GateOutcome:
      type: string
      enum: [ALLOW, REVIEW, BLOCK]
    AISystem:
      type: object
      required:
        - id
        - urn
        - tenantId
        - name
        - systemType
        - status
        - createdAt
      properties:
        id:
          type: string
        urn:
          type: string
        tenantId:
          type: string
        name:
          type: string
        systemType:
          $ref: "#/components/schemas/SystemType"
        businessPurpose:
          type: string
        owner:
          type: string
        environment:
          $ref: "#/components/schemas/Environment"
        dataClassification:
          $ref: "#/components/schemas/DataClassification"
        geography:
          type: string
        autonomyLevel:
          $ref: "#/components/schemas/AutonomyLevel"
        status:
          $ref: "#/components/schemas/LifecycleStatus"
        riskBand:
          $ref: "#/components/schemas/RiskBand"
        currentVersionId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AISystemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AISystem"
    ApprovalRecord:
      type: object
      required: [function, approved, actorId, recordedAt]
      properties:
        function:
          type: string
          enum: [privacy, security, risk, owner]
        approved:
          type: boolean
        actorId:
          type: string
        recordedAt:
          type: string
          format: date-time
    RiskDriver:
      type: object
      required: [code, contribution]
      properties:
        code:
          type: string
        contribution:
          type: number
        detail:
          type: string
    RiskAssessment:
      type: object
      required:
        - id
        - systemId
        - score
        - riskBand
        - confidence
        - drivers
        - engineVersion
        - assessedAt
      properties:
        id:
          type: string
        systemId:
          type: string
        score:
          type: number
        riskBand:
          $ref: "#/components/schemas/RiskBand"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        drivers:
          type: array
          items:
            $ref: "#/components/schemas/RiskDriver"
        hardConstraints:
          type: array
          items:
            type: string
        missingInputs:
          type: array
          items:
            type: string
        engineVersion:
          type: string
        assessedAt:
          type: string
          format: date-time
    PolicyReason:
      type: object
      required: [code, severity]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        message:
          type: string
    PolicyDecision:
      type: object
      required:
        - id
        - systemId
        - outcome
        - policyBundle
        - reasons
        - decidedAt
      properties:
        id:
          type: string
        systemId:
          type: string
        outcome:
          $ref: "#/components/schemas/GateOutcome"
        policyBundle:
          type: string
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/PolicyReason"
        requiredActions:
          type: array
          items:
            type: string
        policyDigest:
          type: string
        inputDigest:
          type: string
        fingerprint:
          type: string
        snapshotId:
          type: string
        authorizationId:
          type: string
        decidedAt:
          type: string
          format: date-time
    AISystem360:
      type: object
      required: [system]
      properties:
        system:
          $ref: "#/components/schemas/AISystem"
        registration:
          $ref: "#/components/schemas/AISystemRegistration"
        latestAssessment:
          $ref: "#/components/schemas/RiskAssessment"
        latestDecision:
          $ref: "#/components/schemas/PolicyDecision"
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalRecord"
        humanOversight:
          type: array
          items:
            type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceArtifact"
        controls:
          type: array
          items:
            $ref: "#/components/schemas/ControlAssessment"
        latestSnapshot:
          $ref: "#/components/schemas/GovernanceSnapshot"
        latestAuthorization:
          $ref: "#/components/schemas/DeploymentAuthorization"
    ApprovalRequest:
      type: object
      required: [function, approved]
      properties:
        function:
          type: string
          enum: [privacy, security, risk, owner]
        approved:
          type: boolean
    OversightRequest:
      type: object
      required: [controls]
      properties:
        controls:
          type: array
          items:
            type: string
          minItems: 1
    DeploymentGateRequest:
      type: object
      properties:
        environment:
          $ref: "#/components/schemas/Environment"
        evidenceStale:
          type: boolean
          default: false
        cloud:
          type: string
          default: local
        region:
          type: string
        audience:
          type: string
          default: cicd
    EvidenceAttachRequest:
      type: object
      required: [type, filename, content]
      properties:
        type:
          type: string
          enum: [MODEL_CARD, EVALUATION_RUN, FAIRNESS_EVALUATION, SECURITY_SCAN, SBOM]
        filename:
          type: string
        content:
          type: string
        collectedAt:
          type: string
          format: date-time
        boundVersionId:
          type: string
        mediaType:
          type: string
    EvidenceArtifact:
      type: object
      required: [id, systemId, boundVersionId, type, sha256, verificationStatus, collectedAt]
      properties:
        id:
          type: string
        systemId:
          type: string
        boundVersionId:
          type: string
        type:
          type: string
        filename:
          type: string
        uri:
          type: string
        sha256:
          type: string
        bytesSize:
          type: integer
        collectorVersion:
          type: string
        verificationStatus:
          type: string
          enum: [VERIFIED, FAIL]
        collectedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ControlAssessment:
      type: object
      required: [controlId, evidenceType, required, status, reason]
      properties:
        controlId:
          type: string
        evidenceType:
          type: string
        required:
          type: boolean
        status:
          type: string
          enum: [PASS, FAIL, STALE, UNKNOWN, NOT_APPLICABLE]
        evidenceId:
          type: string
        reason:
          type: string
        maxAgeDays:
          type: integer
        sha256:
          type: string
    GovernanceSnapshot:
      type: object
      required:
        - id
        - systemId
        - policyDecisionId
        - outcome
        - assetVersionId
        - fingerprint
        - snapshot
        - createdAt
      properties:
        id:
          type: string
        systemId:
          type: string
        policyDecisionId:
          type: string
        outcome:
          $ref: "#/components/schemas/GateOutcome"
        assetVersionId:
          type: string
        fingerprint:
          type: string
        snapshot:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    DeploymentAuthorization:
      type: object
      required:
        - id
        - systemId
        - decisionId
        - assetVersionId
        - environment
        - fingerprint
        - signature
        - issuedAt
        - expiresAt
      properties:
        id:
          type: string
        systemId:
          type: string
        decisionId:
          type: string
        assetVersionId:
          type: string
        environment:
          $ref: "#/components/schemas/Environment"
        cloud:
          type: string
        region:
          type: string
        audience:
          type: string
        nonce:
          type: string
        fingerprint:
          type: string
        signature:
          type: string
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        consumedAt:
          type: string
          format: date-time
    AuthorizationVerifyRequest:
      type: object
      properties:
        signature:
          type: string
        consume:
          type: boolean
          default: false
    AuthorizationVerify:
      type: object
      required: [outcome, authorization]
      properties:
        outcome:
          $ref: "#/components/schemas/GateOutcome"
        reasons:
          type: array
          items:
            type: string
        authorization:
          $ref: "#/components/schemas/DeploymentAuthorization"
    AuditEvent:
      type: object
      required:
        - eventId
        - eventType
        - aggregateId
        - occurredAt
        - hash
      properties:
        eventId:
          type: string
        eventType:
          type: string
        aggregateId:
          type: string
        actor:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
        hash:
          type: string
        previousEventHash:
          type: string
    AuditEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
