openapi: 3.1.1
info:
  title: AI Governance Control Plane API
  version: 0.9.0
  description: |
    Slice 9 contract: AI system registry, deterministic risk, hashed evidence,
    fail-closed deployment gate, immutable snapshots, short-lived authorization,
    workflow cases with SLA clocks, time-bounded exceptions, findings, incidents,
    runtime revocation, agent action/resource authorization, desired versus
    observed reconciliation, OIDC bearer identity, Alembic schema migrations,
    a transactional audit outbox, an operator CLI, and GitHub deployment checks.
    Tenant, actor, and roles come from the validated token, never from the request body.
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8000
    description: Local
tags:
  - name: Health
  - name: AI Systems
  - name: Risk
  - name: Policy
  - name: Audit
  - name: Evidence
  - name: Authorization
  - name: Workflow
  - name: Findings
  - name: Agents
  - name: Reconciliation
  - name: Identity
  - name: Outbox
  - name: Integrations
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Liveness
      operationId: getHealth
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ready:
    get:
      tags: [Health]
      security: []
      summary: Readiness
      operationId: getReady
      responses:
        "200":
          description: Dependencies are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Not ready
  /v1/me:
    get:
      tags: [Identity]
      summary: Return the authenticated principal bound to the bearer token
      operationId: getMe
      responses:
        "200":
          description: Current principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: OIDC issuer or JWKS is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/ai-systems:
    get:
      tags: [AI Systems]
      summary: List AI systems for the authenticated tenant
      operationId: listAISystems
      responses:
        "200":
          description: Inventory page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystemList"
    post:
      tags: [AI Systems]
      summary: Register an AI system
      operationId: registerAISystem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AISystemRegistration"
      responses:
        "201":
          description: Registered in DRAFT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/ai-systems/{systemId}:
    get:
      tags: [AI Systems]
      summary: Get AI System 360 payload
      operationId: getAISystem
      parameters:
        - $ref: "#/components/parameters/systemId"
      responses:
        "200":
          description: Canonical system view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/assessments:
    post:
      tags: [Risk]
      summary: Compute a deterministic risk assessment
      operationId: assessAISystem
      parameters:
        - $ref: "#/components/parameters/systemId"
      responses:
        "201":
          description: New assessment snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAssessment"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/approvals:
    post:
      tags: [Policy]
      summary: Record a control-function approval
      operationId: recordApproval
      parameters:
        - $ref: "#/components/parameters/systemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
      responses:
        "201":
          description: Approval recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "409":
          description: Segregation of duties violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/oversight:
    post:
      tags: [Policy]
      summary: Attach human-oversight controls
      operationId: attachOversight
      parameters:
        - $ref: "#/components/parameters/systemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OversightRequest"
      responses:
        "200":
          description: Oversight updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/deployments/gate:
    post:
      tags: [Policy]
      summary: Evaluate the production deployment gate
      operationId: evaluateDeploymentGate
      parameters:
        - $ref: "#/components/parameters/systemId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentGateRequest"
      responses:
        "200":
          description: Gate decision (ALLOW, REVIEW, or BLOCK) plus fingerprint; authorizationId only on ALLOW
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecision"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/audit-events:
    get:
      tags: [Audit]
      summary: Append-only audit trail for an AI system
      operationId: listAuditEvents
      parameters:
        - $ref: "#/components/parameters/systemId"
      responses:
        "200":
          description: Oldest-first hash-chained events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/evidence:
    post:
      tags: [Evidence]
      summary: Attach hashed evidence bound to the current asset version
      operationId: attachEvidence
      parameters:
        - $ref: "#/components/parameters/systemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceAttachRequest"
      responses:
        "201":
          description: Evidence stored and hashed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/evidence/{evidenceId}/verify:
    post:
      tags: [Evidence]
      summary: Recompute the digest of stored bytes and compare to the record
      operationId: verifyEvidence
      parameters:
        - $ref: "#/components/parameters/systemId"
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verification status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/authorizations/{authorizationId}/verify:
    post:
      tags: [Authorization]
      summary: Verify a short-lived deployment authorization
      description: |
        Returns HTTP 200 with outcome ALLOW or DENY. Expired, revoked, consumed,
        version-mismatched, or tampered signatures are DENY — never a silent pass.
      operationId: verifyDeploymentAuthorization
      parameters:
        - $ref: "#/components/parameters/systemId"
        - $ref: "#/components/parameters/authorizationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationVerifyRequest"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationVerify"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/authorizations/{authorizationId}/revoke:
    post:
      tags: [Authorization]
      summary: Revoke a deployment authorization immediately
      operationId: revokeDeploymentAuthorization
      parameters:
        - $ref: "#/components/parameters/systemId"
        - $ref: "#/components/parameters/authorizationId"
      responses:
        "200":
          description: Authorization is no longer valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentAuthorization"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/exceptions:
    post:
      tags: [Workflow]
      summary: Request a time-bounded exception for a named gate violation
      operationId: requestException
      parameters:
        - $ref: "#/components/parameters/systemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExceptionRequest"
      responses:
        "201":
          description: Exception requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/exceptions/{exceptionId}/grant:
    post:
      tags: [Workflow]
      summary: Grant a requested exception (reviewer, segregation of duties)
      operationId: grantException
      parameters:
        - $ref: "#/components/parameters/systemId"
        - $ref: "#/components/parameters/exceptionId"
      responses:
        "200":
          description: Exception granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "409":
          description: Segregation of duties violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/exceptions/{exceptionId}/deny:
    post:
      tags: [Workflow]
      summary: Deny a requested exception
      operationId: denyException
      parameters:
        - $ref: "#/components/parameters/systemId"
        - $ref: "#/components/parameters/exceptionId"
      responses:
        "200":
          description: Exception denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/exceptions/{exceptionId}/revoke:
    post:
      tags: [Workflow]
      summary: Revoke a granted exception and active deployment authorizations
      operationId: revokeException
      parameters:
        - $ref: "#/components/parameters/systemId"
        - $ref: "#/components/parameters/exceptionId"
      responses:
        "200":
          description: Exception revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/findings:
    post:
      tags: [Findings]
      summary: Record a version-bound finding; HIGH and CRITICAL auto-promote to an incident
      operationId: recordFinding
      parameters:
        - $ref: "#/components/parameters/systemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingRequest"
      responses:
        "201":
          description: Finding recorded; HIGH/CRITICAL also open an incident and revoke authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/findings/{findingId}/promote:
    post:
      tags: [Findings]
      summary: Promote an open finding to an incident and revoke live authorization
      operationId: promoteFinding
      parameters:
        - $ref: "#/components/parameters/systemId"
        - $ref: "#/components/parameters/findingId"
      responses:
        "200":
          description: Finding promoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "409":
          description: Segregation of duties violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/findings/{findingId}/dismiss:
    post:
      tags: [Findings]
      summary: Dismiss an open finding without opening an incident
      operationId: dismissFinding
      parameters:
        - $ref: "#/components/parameters/systemId"
        - $ref: "#/components/parameters/findingId"
      responses:
        "200":
          description: Finding dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "409":
          description: Segregation of duties violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/incidents/{incidentId}/resolve:
    post:
      tags: [Findings]
      summary: Resolve an open incident; does not mint a new authorization
      operationId: resolveIncident
      parameters:
        - $ref: "#/components/parameters/systemId"
        - $ref: "#/components/parameters/incidentId"
      responses:
        "200":
          description: Incident resolved; re-evaluate the gate to authorize
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "409":
          description: Segregation of duties violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/capabilities:
    post:
      tags: [Agents]
      summary: Declare a version-bound agent capability (action + resource pattern)
      operationId: declareCapability
      parameters:
        - $ref: "#/components/parameters/systemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapabilityRequest"
      responses:
        "201":
          description: Capability declared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/capabilities/{capabilityId}/approve:
    post:
      tags: [Agents]
      summary: Approve a privileged capability (reviewer, segregation of duties)
      operationId: approveCapability
      parameters:
        - $ref: "#/components/parameters/systemId"
        - $ref: "#/components/parameters/capabilityId"
      responses:
        "200":
          description: Capability approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "409":
          description: Segregation of duties violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/actions/authorize:
    post:
      tags: [Agents]
      summary: Authorize an agent action against a resource (ALLOW or DENY)
      operationId: authorizeAction
      parameters:
        - $ref: "#/components/parameters/systemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionAuthorizeRequest"
      responses:
        "200":
          description: Action decision; ALLOW mints a short-lived action token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionDecision"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/action-authorizations/{actionAuthorizationId}/verify:
    post:
      tags: [Agents]
      summary: Verify an action authorization token
      operationId: verifyActionAuthorization
      parameters:
        - $ref: "#/components/parameters/systemId"
        - $ref: "#/components/parameters/actionAuthorizationId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationVerifyRequest"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionAuthorizationVerify"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/action-authorizations/{actionAuthorizationId}/revoke:
    post:
      tags: [Agents]
      summary: Revoke an action authorization immediately
      operationId: revokeActionAuthorization
      parameters:
        - $ref: "#/components/parameters/systemId"
        - $ref: "#/components/parameters/actionAuthorizationId"
      responses:
        "200":
          description: Action authorization is no longer valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionAuthorization"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/observations:
    post:
      tags: [Reconciliation]
      summary: Record an observed runtime state and reconcile it against the authorized desired state
      operationId: recordObservation
      parameters:
        - $ref: "#/components/parameters/systemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationRequest"
      responses:
        "201":
          description: Observation recorded; HIGH drift revokes authorization and blocks the system
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/outbox/publish:
    post:
      tags: [Outbox]
      summary: Publish unpublished dual-written audit events to the configured sink
      operationId: publishOutbox
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Number of events accepted by the sink
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxPublish"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/integrations/github/webhook:
    post:
      tags: [Integrations]
      security: []
      summary: HMAC-verified GitHub webhook that records the latest deployment-gate conclusion
      operationId: githubWebhook
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Check recorded against the latest gate outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubCheck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: Webhook secret is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/ai-systems/{systemId}/github-checks:
    post:
      tags: [Integrations]
      summary: Record the latest deployment-gate outcome as a GitHub check for a commit SHA
      operationId: recordGithubCheck
      parameters:
        - $ref: "#/components/parameters/systemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubCheckRequest"
      responses:
        "201":
          description: Check persisted locally; posted to GitHub when a token and repo are configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubCheck"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ai-systems/{systemId}/versions:
    post:
      tags: [AI Systems]
      summary: Cut a new asset version so prior evidence no longer satisfies controls
      operationId: cutAssetVersion
      parameters:
        - $ref: "#/components/parameters/systemId"
      responses:
        "201":
          description: New current version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AISystem360"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Slice 9 bearer JWT from the configured OIDC issuer, or local demo tokens `demo` / `demo-reviewer` when demo auth is enabled.
  parameters:
    systemId:
      name: systemId
      in: path
      required: true
      schema:
        type: string
    authorizationId:
      name: authorizationId
      in: path
      required: true
      schema:
        type: string
    exceptionId:
      name: exceptionId
      in: path
      required: true
      schema:
        type: string
    findingId:
      name: findingId
      in: path
      required: true
      schema:
        type: string
    incidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
    capabilityId:
      name: capabilityId
      in: path
      required: true
      schema:
        type: string
    actionAuthorizationId:
      name: actionAuthorizationId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found in this tenant
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationError:
      description: Request failed schema validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        details:
          type: object
          additionalProperties: true
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        traceId:
          type: string
        reasons:
          type: array
          items:
            type: string
    Principal:
      type: object
      required: [tenantId, actorId, actorType, roles, displayName, authMethod]
      properties:
        tenantId:
          type: string
        actorId:
          type: string
        actorType:
          type: string
        roles:
          type: array
          items:
            type: string
        displayName:
          type: string
        authMethod:
          type: string
          enum: [demo, oidc]
    AISystemRegistration:
      type: object
      required:
        - name
        - systemType
        - businessPurpose
        - owner
        - environment
        - dataClassification
        - geography
        - autonomyLevel
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        systemType:
          $ref: "#/components/schemas/SystemType"
        businessPurpose:
          type: string
        owner:
          type: string
        environment:
          $ref: "#/components/schemas/Environment"
        dataClassification:
          $ref: "#/components/schemas/DataClassification"
        geography:
          type: string
        autonomyLevel:
          $ref: "#/components/schemas/AutonomyLevel"
        modelRefs:
          type: array
          items:
            type: string
        vendorRefs:
          type: array
          items:
            type: string
        intendedUsers:
          type: string
        customerImpact:
          $ref: "#/components/schemas/ImpactLevel"
        financialImpact:
          $ref: "#/components/schemas/ImpactLevel"
        humanOversight:
          type: array
          items:
            type: string
        knownLimitations:
          type: string
        usesCustomerDecision:
          type: boolean
          default: false
        publicEndpoint:
          type: boolean
          default: false
        evaluationRefs:
          type: array
          items:
            type: string
        monitoringEnabled:
          type: boolean
          default: false
    SystemType:
      type: string
      enum: [PREDICTIVE_MODEL, GENAI_APP, AGENT, THIRD_PARTY_LLM, DATASET]
    Environment:
      type: string
      enum: [dev, test, staging, production]
    DataClassification:
      type: string
      enum: [PUBLIC, INTERNAL, CONFIDENTIAL, PII, PCI, RESTRICTED]
    AutonomyLevel:
      type: string
