services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aigov
      POSTGRES_PASSWORD: aigov
      POSTGRES_DB: aigov
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigov"]
      interval: 5s
      timeout: 3s
      retries: 10

  opa:
    image: openpolicyagent/opa:0.70.0
    command: ["run", "--server", "--addr", ":8181", "/policies"]
    volumes:
      - ../../policies/rego/deployment.rego:/policies/deployment.rego:ro
    ports:
      - "8181:8181"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      AIGOV_DATABASE_URL: postgresql+asyncpg://aigov:aigov@postgres:5432/aigov
      AIGOV_OPA_URL: http://opa:8181
      AIGOV_CORS_ORIGINS: http://localhost:3000
      AIGOV_DEMO_AUTH: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_started
